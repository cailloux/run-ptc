<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Run PTC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>Run PTC</h1>
    <div id="completion">Loading…</div>
    <div id="sync">
      <div id="sync-status"></div>
      <button id="sync-now" disabled>Sync now</button>
    </div>
    <div id="route">
      <div class="route-row">
        <button id="route-toggle">Plan a route</button>
        <span id="route-distance"></span>
      </div>
      <div id="route-tools" hidden>
        <div class="route-row">
          <button id="route-undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
          <button id="route-redo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
          <button id="route-retrace">Retrace to start</button>
          <button id="route-clear">Clear</button>
          <button id="route-export">Export GPX</button>
        </div>
        <div class="route-help">Click to add a leg. Shift-click the route to retrace back to that point.</div>
      </div>
      <div id="route-message"></div>
    </div>
    <table id="stats"></table>
    <form id="find">
      <input id="find-oid" type="number" placeholder="Cart path OBJECTID_1">
      <button>Find</button>
    </form>
    <div id="legend">
      <div>
        <span class="swatch complete"></span>Complete cart path
      </div>
      <div>
        <span class="swatch cart-run"></span>Run
        <span class="swatch cart-not-run"></span>Not run
        <span class="legend-note">(cart path, incomplete)</span>
      </div>
      <div>
        <span class="swatch road-run"></span>Road run
        <span class="swatch road-not-run"></span>Road not run
      </div>
      <div>
        <span class="swatch excluded"></span>Excluded
        <span class="swatch uncounted"></span>Not counted
      </div>
      <div>
        <span class="dot missed"></span>Missed path node
        <span class="dot missed-road"></span>Missed road node
      </div>
      <div>
        <span class="dot hit"></span>Hit node
        <span class="legend-note">(nodes show from zoom 15)</span>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
          integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="map.js"></script>
  <script src="route.js"></script>
</body>
</html>
