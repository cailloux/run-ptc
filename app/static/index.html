<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Run PTC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>Run PTC</h1>
    <div id="completion">Loading…</div>
    <table id="stats"></table>
    <form id="find">
      <input id="find-oid" type="number" placeholder="Cart path OBJECTID_1">
      <button>Find</button>
    </form>
    <div id="legend">
      <span class="swatch cartpath"></span>Counted cart path
      <span class="swatch road"></span>Counted road<br>
      <span class="swatch uncounted"></span>Not counted
      <span class="swatch excluded"></span>Excluded<br>
      <span class="dot missed"></span>Missed node
      <span class="dot hit"></span>Hit node (from zoom 15)
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
          integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="map.js"></script>
</body>
</html>
