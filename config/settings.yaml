# Tunables. Changes take effect on the next import (and, from Phase 3, recompute).

# Node spacing along each part of a counted segment. Actual spacing is this or
# slightly less, so both endpoints land exactly on nodes.
node_spacing_m: 20

# Whole features shorter than this are dropped on import.
min_segment_length_m: 1

# Parts of a multipart feature shorter than this stay in the geometry for
# routing but get no nodes.
min_part_length_m: 1

# Grid used to snap geometry before hashing, for dedupe and change detection.
dedupe_grid_m: 0.01

# Cart path Type values that count toward completion.
cartpath_counted_types: [Path, Bridge, Tunnel]

# Roads count only when their City attribute equals this.
road_counted_city: PEACHTREE CITY

# Intervals.icu activity types synced as runs. VirtualRun (treadmill apps) is left out.
sync_run_types: [Run, TrailRun]

# First date the initial backfill asks Intervals for. The earliest run is from 2023.
sync_backfill_start: 2023-01-01

# Tracks are split wherever consecutive GPS fixes are more than this far apart.
track_gap_split_m: 100

# A node is hit when a run passes within its radius. Roads in the wide classes
# get the wide radius because sidewalks sit farther from the centerline;
# CLASS = Arterial is SR-74 and SR-54. Changes take effect on the next recompute.
match_radius_cartpath_m: 20
match_radius_road_m: 20
match_radius_wide_m: 30
match_radius_wide_road_classes: [Arterial]
