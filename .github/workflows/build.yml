name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      db:
        image: pgrouting/pgrouting:17-3.5-4.0.1
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Tests run inside the image's test target, so they always use the
      # Python version that ships.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: run-ptc:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tests
        shell: bash   # runs with pipefail, so a pytest failure fails the step through tee
        run: >-
          docker run --rm --network host
          -e TEST_DATABASE_URL=postgresql://postgres@localhost:5432/test
          run-ptc:test pytest -q -ra -p no:cacheprovider tests | tee pytest.log
      # The count, plus each failing test's name and error, on the run's Summary tab.
      - name: Test summary
        if: always()
        run: |
          [ -f pytest.log ] || exit 0
          {
            echo '### Tests'
            echo '```'
            if grep -q 'short test summary info' pytest.log; then
              sed -n '/short test summary info/,$p' pytest.log
            else
              tail -n 1 pytest.log
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      # Pull requests build the runtime image to catch Dockerfile breakage;
      # only pushes to main publish it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
